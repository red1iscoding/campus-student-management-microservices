server:
  port: 8000

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "http://localhost:3000"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      routes:
        - id: student-service
          uri: http://localhost:8081
          predicates:
            - Path=/students/**
          filters:
            - RewritePath=/students/(?<segment>.*), /$\{segment}

        - id: course-service  
          uri: http://localhost:8082
          predicates:
            - Path=/courses/**
        # NEW: GraphQL Service Route
        - id: graphql-service
          uri: http://localhost:4000
          predicates:
            - Path=/graphql/**
logging:
  level:
    "[org.springframework.cloud.gateway]": DEBUG
    "[reactor.netty]": DEBUG